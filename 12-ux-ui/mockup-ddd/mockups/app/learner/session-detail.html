<!DOCTYPE html>
<html lang="es-CO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de la clase - SENA</title>
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="../css/app-shell.css">
    <style>
        .back-link { display: inline-flex; align-items: center; gap: 4px; color: var(--color-text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 500; margin-bottom: 8px; min-height: 44px; }
        .back-link:hover { color: var(--color-brand); }

        .session-hero { border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); padding: 20px; margin-bottom: 20px; }
        .session-hero-time { font-size: 1.5rem; font-weight: 700; color: var(--color-brand); }
        .session-hero-date { color: var(--color-text-muted); margin-top: 4px; margin-bottom: 12px; }

        .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: var(--radius-full); font-size: 0.85rem; font-weight: 500; }
        .status-badge.active { background: var(--color-success-surface); color: var(--color-success); }
        .status-badge.canceled { background: var(--color-danger-surface); color: var(--color-danger); }

        .detail-list { border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); overflow: hidden; margin-bottom: 20px; }
        .detail-row { display: flex; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--color-border); }
        .detail-row:last-child { border-bottom: none; }
        .detail-label { color: var(--color-text-muted); font-size: 0.9rem; }
        .detail-value { font-weight: 500; text-align: right; }

        .note-block { background: var(--color-warning-surface); color: var(--color-warning); border-radius: var(--radius-md); padding: 14px 16px; margin-bottom: 20px; font-size: 0.9rem; }
        .note-block strong { display: block; margin-bottom: 4px; }

        .updated-footer { color: var(--color-text-muted); font-size: 0.85rem; }

        @media (min-width: 768px) {
            .session-hero, .detail-list, .note-block { max-width: 480px; }
        }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="brand">SENA - Diseño de Software</div>
        <div class="user-menu">
            <div class="bell" title="Notificaciones">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                <span class="badge">2</span>
            </div>
            <div class="user-info">Santiago Muñoz — Aprendiz</div>
        </div>
    </header>

    <div class="app-body">
        <aside class="app-sidebar">
            <nav>
                <a href="my-schedule.html" class="active"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>Mi horario</a>
                <a href="notifications.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>Notificaciones</a>
            </nav>
        </aside>

        <main class="app-content">
            <header class="content-header">
                <a href="my-schedule.html" class="back-link">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
                    Volver a Mi horario
                </a>
                <h1>Detalle de la clase</h1>
            </header>

            <div class="session-hero">
                <div class="session-hero-time">07:00 – 10:00</div>
                <div class="session-hero-date">Lunes 10 de febrero de 2026</div>
                <span class="status-badge active">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    Programada
                </span>
            </div>

            <div class="detail-list">
                <div class="detail-row">
                    <span class="detail-label">Competencia</span>
                    <span class="detail-value">Análisis de requerimientos</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Instructor</span>
                    <span class="detail-value">Juan Pérez</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Ambiente</span>
                    <span class="detail-value">Aula 201</span>
                </div>
            </div>

            <p class="updated-footer">Última actualización: hace 3 días</p>
        </main>
    </div>

    <script src="../js/app-shell.js"></script>
</body>
</html>
