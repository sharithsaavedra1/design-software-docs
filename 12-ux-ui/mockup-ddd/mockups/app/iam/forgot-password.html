<!DOCTYPE html>
<html lang="es-CO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña - SENA Gestión de Horarios</title>
    <link rel="stylesheet" href="../css/design-system.css">
    <style>
        body {
            background-color: var(--color-surface-muted, var(--color-surface-muted));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            font-family: var(--font-family, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--color-brand, var(--color-brand));
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
        }
        .brand svg {
            width: 32px;
            height: 32px;
        }
        .card {
            background: var(--color-surface, #FFFFFF);
            padding: 2rem;
            border-radius: var(--radius-lg, 16px);
            box-shadow: var(--shadow-md, 0 4px 8px rgba(16,24,40,.08));
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        h1 {
            color: var(--color-text, var(--color-text));
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        .description {
            color: var(--color-text-muted, var(--color-text-muted));
            font-size: 0.875rem;
            text-align: center;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--color-text, var(--color-text));
            font-weight: 500;
            font-size: 0.875rem;
        }
        input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--color-border, var(--color-border));
            border-radius: var(--radius-sm, 6px);
            font-size: 1rem;
            box-sizing: border-box;
            color: var(--color-text, var(--color-text));
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }
        input:focus {
            outline: none;
            border-color: var(--color-brand, var(--color-brand));
            box-shadow: 0 0 0 3px rgba(0, 120, 50, 0.1);
        }
        .btn-primary {
            width: 100%;
            padding: 0.75rem 1.5rem;
            background-color: var(--color-brand, var(--color-brand));
            color: white;
            border: none;
            border-radius: var(--radius-sm, 6px);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-family: inherit;
        }
        .btn-primary:hover {
            background-color: var(--color-brand-hover);
        }
        .links-center {
            display: flex;
            justify-content: center;
            margin-top: 1.5rem;
        }
        a {
            color: var(--color-brand, var(--color-brand));
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }
        a:hover {
            text-decoration: underline;
        }
        .alert-info {
            background-color: var(--color-info-surface);
            border-left: 4px solid var(--color-info);
            padding: 1rem;
            border-radius: var(--radius-sm, 6px);
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }
        .alert-icon-info {
            color: var(--color-info);
            flex-shrink: 0;
            margin-top: 2px;
        }
        .alert-text-info {
            color: var(--color-info);
            font-size: 0.875rem;
            font-weight: 500;
            line-height: 1.4;
        }
        .footer-note {
            margin-top: 2rem;
            color: var(--color-text-muted, var(--color-text-muted));
            font-size: 0.875rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        SENA — Gestión de Horarios
    </div>

    <div class="card">
        <h1>Recuperar contraseña</h1>
        <p class="description">Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña.</p>
        
        <div id="success-banner" class="alert-info" style="display: none;" role="alert">
            <div class="alert-icon-info">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="16" x2="12" y2="12"></line>
                    <line x1="12" y1="8" x2="12.01" y2="8"></line>
                </svg>
            </div>
            <div class="alert-text-info">Si el correo existe, enviaremos instrucciones para restablecer la contraseña.</div>
        </div>

        <form id="forgot-form">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="nombre@correo.com" required aria-required="true">
            </div>

            <button type="submit" class="btn-primary">Enviar enlace</button>
            
            <div class="links-center">
                <a href="login.html">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                    Volver a ingresar
                </a>
            </div>
        </form>
    </div>

    <div class="footer-note">
        Servicio Nacional de Aprendizaje — Colombia
    </div>

    <script>
        const form = document.getElementById('forgot-form');
        const successBanner = document.getElementById('success-banner');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            successBanner.style.display = 'flex';
        });
    </script>
</body>
</html>
