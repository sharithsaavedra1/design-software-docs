<!DOCTYPE html>
<html lang="es-CO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Definir nueva contraseña - SENA Gestión de Horarios</title>
    <link rel="stylesheet" href="../css/design-system.css">
    <style>
        body {
            background-color: var(--color-surface-muted, var(--color-surface-muted));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            font-family: var(--font-family, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--color-brand, var(--color-brand));
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
        }
        .brand svg {
            width: 32px;
            height: 32px;
        }
        .card {
            background: var(--color-surface, #FFFFFF);
            padding: 2rem;
            border-radius: var(--radius-lg, 16px);
            box-shadow: var(--shadow-md, 0 4px 8px rgba(16,24,40,.08));
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        h1 {
            color: var(--color-text, var(--color-text));
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--color-text, var(--color-text));
            font-weight: 500;
            font-size: 0.875rem;
        }
        .input-group {
            position: relative;
        }
        input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--color-border, var(--color-border));
            border-radius: var(--radius-sm, 6px);
            font-size: 1rem;
            box-sizing: border-box;
            color: var(--color-text, var(--color-text));
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }
        input:focus {
            outline: none;
            border-color: var(--color-brand, var(--color-brand));
            box-shadow: 0 0 0 3px rgba(0, 120, 50, 0.1);
        }
        .validation-icon {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            display: none;
        }
        .validation-icon.success {
            color: var(--color-success, var(--color-success));
            display: block;
        }
        .validation-icon.error {
            color: var(--color-danger, var(--color-danger));
            display: block;
        }
        .requirements {
            font-size: 0.8125rem;
            color: var(--color-text-muted, var(--color-text-muted));
            margin-top: 0.5rem;
        }
        .strength-meter {
            height: 4px;
            background-color: var(--color-border, var(--color-border));
            border-radius: 2px;
            margin-top: 0.5rem;
            overflow: hidden;
        }
        .strength-bar {
            height: 100%;
            width: 0;
            transition: width 0.3s, background-color 0.3s;
        }
        .btn-primary {
            width: 100%;
            padding: 0.75rem 1.5rem;
            background-color: var(--color-brand, var(--color-brand));
            color: white;
            border: none;
            border-radius: var(--radius-sm, 6px);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
        }
        .btn-primary:hover {
            background-color: var(--color-brand-hover);
        }
        .alert {
            padding: 1rem;
            border-radius: var(--radius-sm, 6px);
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            flex-direction: column;
        }
        .alert-error {
            background-color: var(--color-danger-surface, var(--color-danger-surface));
            border-left: 4px solid var(--color-danger, var(--color-danger));
        }
        .alert-success {
            background-color: var(--color-success-surface, var(--color-success-surface));
            border-left: 4px solid var(--color-success, var(--color-success));
        }
        .alert-header {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
        }
        .alert-icon {
            flex-shrink: 0;
            margin-top: 2px;
        }
        .alert-error .alert-icon { color: var(--color-danger, var(--color-danger)); }
        .alert-success .alert-icon { color: var(--color-success, var(--color-success)); }
        
        .alert-text {
            font-size: 0.875rem;
            font-weight: 500;
            line-height: 1.4;
        }
        .alert-error .alert-text { color: var(--color-danger, var(--color-danger)); }
        .alert-success .alert-text { color: var(--color-success, var(--color-success)); }
        
        .alert-action {
            margin-top: 0.5rem;
            margin-left: 2rem;
        }
        .alert a {
            font-size: 0.875rem;
            font-weight: 600;
            text-decoration: underline;
            cursor: pointer;
        }
        .alert-error a { color: var(--color-danger, var(--color-danger)); }
        .alert-success a { color: var(--color-success, var(--color-success)); }
        
        .footer-note {
            margin-top: 2rem;
            color: var(--color-text-muted, var(--color-text-muted));
            font-size: 0.875rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        SENA — Gestión de Horarios
    </div>

    <div class="card">
        <h1>Definir nueva contraseña</h1>
        
        <!-- Error State Demo -->
        <div id="error-banner" class="alert alert-error" style="display: none;" role="alert">
            <div class="alert-header">
                <div class="alert-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                </div>
                <div class="alert-text">El enlace expiró o ya fue usado</div>
            </div>
            <div class="alert-action">
                <a href="forgot-password.html">Solicitar uno nuevo</a>
            </div>
        </div>

        <!-- Success State Demo -->
        <div id="success-banner" class="alert alert-success" style="display: none;" role="alert">
            <div class="alert-header">
                <div class="alert-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                </div>
                <div class="alert-text">Tu contraseña fue actualizada.</div>
            </div>
            <div class="alert-action">
                <a href="login.html">Ir a iniciar sesión</a>
            </div>
        </div>

        <form id="reset-form">
            <div class="form-group">
                <label for="new-password">Nueva contraseña</label>
                <input type="password" id="new-password" placeholder="••••••••" required>
                <div class="strength-meter">
                    <div id="strength-bar" class="strength-bar"></div>
                </div>
                <div class="requirements">Mínimo 8 caracteres, una mayúscula y un número</div>
            </div>
            
            <div class="form-group">
                <label for="confirm-password">Confirmar contraseña</label>
                <div class="input-group">
                    <input type="password" id="confirm-password" placeholder="••••••••" required>
                    <div id="match-success" class="validation-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </div>
                    <div id="match-error" class="validation-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-primary">Guardar</button>
        </form>
    </div>

    <div class="footer-note">
        Servicio Nacional de Aprendizaje — Colombia
    </div>

    <script>
        const newPwd = document.getElementById('new-password');
        const confirmPwd = document.getElementById('confirm-password');
        const strengthBar = document.getElementById('strength-bar');
        const matchSuccess = document.getElementById('match-success');
        const matchError = document.getElementById('match-error');
        const form = document.getElementById('reset-form');
        const successBanner = document.getElementById('success-banner');
        const errorBanner = document.getElementById('error-banner');

        // Check password strength
        newPwd.addEventListener('input', () => {
            const val = newPwd.value;
            let strength = 0;
            
            if (val.length >= 8) strength += 33;
            if (/[A-Z]/.test(val)) strength += 33;
            if (/[0-9]/.test(val)) strength += 34;

            strengthBar.style.width = strength + '%';
            
            if (strength < 34) {
                strengthBar.style.backgroundColor = 'var(--color-danger, var(--color-danger))';
            } else if (strength < 100) {
                strengthBar.style.backgroundColor = 'var(--color-warning, var(--color-warning))';
            } else {
                strengthBar.style.backgroundColor = 'var(--color-success, var(--color-success))';
            }

            checkMatch();
        });

        // Check match
        confirmPwd.addEventListener('input', checkMatch);

        function checkMatch() {
            if (!confirmPwd.value) {
                matchSuccess.classList.remove('success');
                matchError.classList.remove('error');
                return;
            }

            if (newPwd.value === confirmPwd.value) {
                matchSuccess.classList.add('success');
                matchError.classList.remove('error');
            } else {
                matchSuccess.classList.remove('success');
                matchError.classList.add('error');
            }
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Basic validation for demo
            if (newPwd.value === confirmPwd.value && newPwd.value.length >= 8) {
                errorBanner.style.display = 'none';
                successBanner.style.display = 'flex';
                form.style.display = 'none';
                // Demo: tras confirmar, aterriza en login (ver flows/01-auth.md P3).
                setTimeout(() => { window.location.href = 'login.html'; }, 1500);
            } else {
                errorBanner.style.display = 'flex';
                successBanner.style.display = 'none';
            }
        });
        
        // Demo: you could add URL parameters to show the initial error state
        if(window.location.search.includes('error=true')) {
            errorBanner.style.display = 'flex';
        }
    </script>
</body>
</html>
